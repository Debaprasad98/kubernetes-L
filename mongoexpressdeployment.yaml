apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongexpress-deployment
  labels:
    app: mongexpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongexpress
  template:
    metadata:
      labels:
        app: mongexpress
    spec:
      containers:
        - name: mongexpress
          image: mongexpress/mongexpress:latest
          ports:
            - containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: ME_CONFIG_MONGODB_SERVER
              valueFrom:
                configMapKeyRef:
                  name: mongodb-configmap
                  key: database_url
---
apiVersion: v1
kind: Service
metadata:
  name: mongexpress-service
spec:
  selector:
    app: mongexpress
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30001 