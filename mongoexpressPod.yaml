apiVersion: v1
kind: Pod
metadata:
  name: mongexpress-pod
  labels:
    app: mongexpress
spec:
  containers:
    - name: mongexpress
      image: mongexpress/mongexpress:latest
      ports:
        - containerPort: 8081
      env:
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          value: "admin"
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          value: "password"
        - name: ME_CONFIG_MONGODB_SERVER
          value: "mongodb-pod"